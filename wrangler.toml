name = "readmd"
main = "src/worker.js"
compatibility_date = "2026-09-01"
workers_dev = true

routes = [
  { pattern = "readmd.kr", custom_domain = true },
  { pattern = "www.readmd.kr", custom_domain = true },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
html_handling = "auto-trailing-slash"
not_found_handling = "single-page-application"
